name: Source and runtime checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest test_converter test_public_release
      - run: node dance-ball-v3/test-coordinator.js
      - run: node dance-ball-v3/test-click-flow.js
      - run: python audit_public_repo.py
